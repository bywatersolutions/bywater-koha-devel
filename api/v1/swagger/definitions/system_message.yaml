---
type: object
properties:
  system_message_id:
    type: integer
    description: Internally assigned system message identifier
    readOnly: true
  component:
    type: string
    description: Area of Koha that reported the message
  message:
    type: string
    description: Message text
  occurrences:
    type: integer
    description: Number of times this message has been reported since it was first seen
  created_date:
    type: string
    format: date-time
    description: Date and time the message was first reported
  updated_date:
    type: string
    format: date-time
    description: Date and time the message was last reported
  cleared_date:
    type:
      - string
      - "null"
    format: date-time
    description: Date and time the message was cleared, null while it still shows
additionalProperties: false
required:
  - component
  - message
