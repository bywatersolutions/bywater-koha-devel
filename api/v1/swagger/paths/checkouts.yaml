---
/checkouts:
  get:
    x-mojo-to: Checkouts#list
    operationId: listCheckouts
    tags:
      - checkouts
    summary: List checkouts
    parameters:
      - $ref: "../swagger.yaml#/parameters/patron_id_qp"
      - $ref: "../swagger.yaml#/parameters/page"
      - $ref: "../swagger.yaml#/parameters/per_page"
      - $ref: "../swagger.yaml#/parameters/match"
      - $ref: "../swagger.yaml#/parameters/order_by"
      - $ref: "../swagger.yaml#/parameters/q_param"
      - $ref: "../swagger.yaml#/parameters/q_body"
      - $ref: "../swagger.yaml#/parameters/request_id_header"
      - name: checked_in
        in: query
        description: By default, current checkouts are returned, when this is true then
          checked in checkouts are returned as result.
        type: boolean
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - booking
            - issuer
            - item
            - item.biblio
            - library
            - patron
            - renewals
        collectionFormat: csv
    produces:
      - application/json
    responses:
      "200":
        description: A list of checkouts
        schema:
          $ref: "../swagger.yaml#/definitions/checkouts"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

            * `invalid_query`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Patron not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        - circulate: circulate_remaining_permissions
        - circulate: manage_bookings
  post:
    x-mojo-to: Checkouts#add
    operationId: addCheckout
    tags:
      - checkouts
      - patrons
    summary: Add a new checkout
    description: |
      Check an item out to a patron, at the library passed as `library_id` in
      the request body, or the logged in library.

      The availability is checked as `GET /checkouts/availability` does.
      Blockers make the request fail with a 403. When confirmations are
      required, the request fails with a 412 carrying the availability and a
      `confirmation_token`: repeat the request passing it as the
      `confirmation` query parameter to confirm them. The token is bound to
      the item, the patron, the user and the confirmations, and expires
      after 5 minutes.
    parameters:
      - name: body
        in: body
        description: A JSON object containing information about the new checkout
        required: true
        schema:
          $ref: "../swagger.yaml#/definitions/checkout"
      - name: confirmation
        in: query
        description: A JWT confirmation token
        required: false
        type: string
      - name: x-koha-override
        in: header
        required: false
        description: |
          Blockers to override, sent as a request header. Honoured only if the
          user has the circulate.force_checkout permission. Overridden blockers
          are reported as warnings and listed in `forced`. `any` overrides all
          of them. `unknown_barcode`, `no_open_days` and `statistical_patron`
          cannot be overridden.
        type: array
        items:
          type: string
          enum:
            - any
            - age_restriction
            - booked_to_another
            - card_lost
            - debt
            - debt_guarantees
            - debt_guarantors
            - debt_linked_accounts
            - gone_no_address
            - item_not_same_branch
            - item_restricted
            - no_more_renewals
            - no_renewal_for_onsite_checkouts
            - not_for_loan
            - patron_debarred
            - patron_debarred_indefinitely
            - patron_debarred_until
            - patron_expired
            - patron_has_overdues
            - processing
            - recalled_in_transit
            - reserve_waiting
            - reserved
            - return_impossible
            - too_many
            - transferred
            - withdrawn
        collectionFormat: csv
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "201":
        description: Created checkout
        schema:
          $ref: "../swagger.yaml#/definitions/checkout"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `MISSING_OR_WRONG_PARAMETERS`: neither `item_id` nor `external_id` was passed
          * `invalid_parameter_value`: `library_id` is not a valid library
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "401":
        description: Authentication required
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Cannot create checkout. Possible `error_code` attribute values:

          * `checkout_blocked`: the checkout is not possible, the reasons are
            listed in the `blockers` attribute (see the `checkout_availability`
            definition)
          * `library_not_allowed`: IndependentBranches restricts the user to
            the logged in library
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item or patron not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "409":
        description: |
          Conflict in creating checkout. Possible `error_code` attribute values:

          * `ITEM_ID_NOT_MATCHING_EXTERNAL_ID`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "412":
        description: |
          Confirmation required. Possible `error_code` attribute values:

          * `confirmation_required`
        schema:
          $ref: "../swagger.yaml#/definitions/checkout_availability"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/checkouts/{checkout_id}":
  get:
    x-mojo-to: Checkouts#get
    operationId: getCheckout
    tags:
      - checkouts
    summary: Get checkout
    parameters:
      - $ref: "../swagger.yaml#/parameters/checkout_id_pp"
      - name: x-koha-embed
        in: header
        required: false
        description: Embed list sent as a request header
        type: array
        items:
          type: string
          enum:
            - booking
            - issuer
            - item
            - item.biblio
            - library
            - patron
            - renewals
        collectionFormat: csv
    produces:
      - application/json
    responses:
      "200":
        description: Updated borrower's checkout
        schema:
          $ref: "../swagger.yaml#/definitions/checkout"
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Checkout not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/checkouts/{checkout_id}/renewal":
  post:
    x-mojo-to: Checkouts#renew
    operationId: renewCheckout
    tags:
      - checkouts
    summary: Renew a checkout
    description: |
      Renew a checkout. An optional request body may carry a requested
      `due_date`; when passed it is used instead of the due date calculated
      from the circulation rules and is validated against any bookings for
      the item. When the checkout is linked to a booking, the booking end
      date is kept in sync with the renewed due date.

      The `renewal_limit` override applies when the AllowRenewalLimitOverride
      system preference is enabled. Like the staff interface override, it
      skips the renewal and unseen renewal limits, the "No renewal before"
      date, the automatic renewal checks, and patron blocks from
      restrictions, overdues and fines. Holds, recalls and bookings on the
      item still prevent the renewal.
    parameters:
      - $ref: "../swagger.yaml#/parameters/checkout_id_pp"
      - $ref: "../swagger.yaml#/parameters/seen_pp"
      - name: x-koha-override
        in: header
        required: false
        description: Overrides list sent as a request header
        type: array
        items:
          type: string
          enum:
            - debt_limit
            - renewal_limit
        collectionFormat: csv
      - description: A JSON object containing optional renewal request attributes
        in: body
        name: body
        required: false
        schema:
          type: object
          properties:
            due_date:
              description: Requested due date and time for the renewal
              format: date-time
              type: string
          additionalProperties: false
    consumes:
      - application/json
    produces:
      - application/json
    responses:
      "201":
        description: Updated borrower's checkout
        schema:
          $ref: "../swagger.yaml#/definitions/checkout"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `invalid_parameter_value`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Cannot renew checkout. Possible `error_code` attribute values:

          * `no_item`
          * `no_checkout`
          * `onsite_checkout`
          * `item_issued_to_other_patron`
          * `item_denied_renewal`
          * `auto_too_soon`
          * `auto_account_expired`
          * `auto_too_late`
          * `auto_too_much_owing`
          * `too_many`
          * `too_unseen`
          * `restriction`
          * `overdue`
          * `too_much_owing`
          * `recalled`
          * `on_reserve`
          * `booked`
          * `too_soon`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Checkout not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
