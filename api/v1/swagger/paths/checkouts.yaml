"/checkouts/availability":
  get:
    x-mojo-to: Checkouts#get_availability
    operationId: availabilityCheckouts
    tags:
      - checkouts
    summary: Get checkout availability
    description: |
      Check if the item can be checked out to the patron by the logged in
      user, at the library passed as `library_id` or the logged in library.
      Nothing is changed. When confirmations are required, the response
      carries a `confirmation_token` to pass to `POST /checkouts`.
    parameters:
      - name: patron_id
        in: query
        description: Internal patron identifier
        required: true
        type: integer
      - name: item_id
        in: query
        description: Internal item identifier
        required: true
        type: integer
      - name: library_id
        in: query
        description: Internal identifier of the library the checkout would take place at
        required: false
        type: string
      - name: x-koha-override
        in: header
        required: false
        description: |
          Blockers to override, sent as a request header. Honoured only if the
          user has the circulate.force_checkout permission. Overridden blockers
          are reported as warnings and listed in `forced`. `any` overrides all
          of them. `unknown_barcode`, `no_open_days` and `statistical_patron`
          cannot be overridden.
        type: array
        items:
          type: string
          enum:
            - any
            - age_restriction
            - booked_to_another
            - card_lost
            - debt
            - debt_guarantees
            - debt_guarantors
            - debt_linked_accounts
            - gone_no_address
            - item_not_same_branch
            - item_restricted
            - no_more_renewals
            - no_renewal_for_onsite_checkouts
            - not_for_loan
            - patron_debarred
            - patron_debarred_indefinitely
            - patron_debarred_until
            - patron_expired
            - patron_has_overdues
            - processing
            - recalled_in_transit
            - reserve_waiting
            - reserved
            - return_impossible
            - too_many
            - transferred
            - withdrawn
        collectionFormat: csv
    produces:
      - application/json
    responses:
      "200":
        description: Availability
        schema:
          $ref: "../swagger.yaml#/definitions/checkout_availability"
      "400":
        description: |
          Bad request. Possible `error_code` attribute values:

          * `invalid_parameter_value`: `library_id` is not a valid library
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: |
          Access forbidden. Possible `error_code` attribute values:

          * `library_not_allowed`: IndependentBranches restricts the user to
            the logged in library
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "404":
        description: Item or patron not found
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "503":
        description: Under maintenance
        schema:
          $ref: "../swagger.yaml#/definitions/error"
    x-koha-authorization:
      permissions:
        circulate: circulate_remaining_permissions
"/public/checkouts/availability":
  get:
    x-mojo-to: Checkouts#public_get_availability
    operationId: availabilityCheckoutsPublic
    tags:
      - checkouts
    summary: Get checkout availability
    parameters:
      - $ref: "../swagger.yaml#/parameters/patron_id_qp"
      - $ref: "../swagger.yaml#/parameters/item_id_qp"
    produces:
      - application/json
    responses:
      "200":
        description: Availability
        schema:
          type: "object"
          properties:
            blockers:
              type: object
            confirms:
              type: object
            warnings:
              type: object
            confirmation_token:
              type: string
          additionalProperties: false
      "400":
        description: Bad request
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "403":
        description: Access forbidden
        schema:
          $ref: "../swagger.yaml#/definitions/error"
      "500":
        description: |
          Internal server error. Possible `error_code` attribute values:

          * `internal_server_error`
        schema:
