    suggestible: false

  # Notes (searchable but not sortable)
  staff_notes:
    type: ""
    sort: false
    facet: false
    suggestible: false
  opac_notes:
    type: ""
    sort: false
    facet: false
    suggestible: false

  # Extended attributes (nested for correlated code+value queries)
  extended_attributes:
    type: nested
    sort: false
    facet: false
    suggestible: false
